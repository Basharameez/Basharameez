<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <!-- Neumorphic Drop Shadows Filter -->
    <filter id="neumorphic-card" x="-10%" y="-10%" width="120%" height="120%">
      <!-- Lower-right dark shadow -->
      <feDropShadow dx="6" dy="6" stdDeviation="9" flood-color="#050508" flood-opacity="1" result="shadow" />
      <!-- Upper-left red glow highlight -->
      <feDropShadow dx="-5" dy="-5" stdDeviation="8" flood-color="#3a0303" flood-opacity="0.9" in="shadow" />
    </filter>
  </defs>

  <style>
    /* Futuristic HUD rotating animations */
    @keyframes rotate-clockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotate-counter {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes core-pulse {
      0% { transform: scale(0.92); opacity: 0.75; filter: drop-shadow(0 0 3px #E60012); }
      50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 10px #FF3D00); }
      100% { transform: scale(0.92); opacity: 0.75; filter: drop-shadow(0 0 3px #E60012); }
    }
    
    .card-base {
      transition: stroke 0.3s ease;
    }
    .card-base:hover {
      stroke: #E60012;
      cursor: crosshair;
    }

    .hud-scanner {
      cursor: pointer;
    }
    .hud-ring-outer {
      transform-origin: 140px 140px;
      animation: rotate-clockwise 16s infinite linear;
    }
    .hud-ring-inner {
      transform-origin: 140px 140px;
      animation: rotate-counter 11s infinite linear;
    }
    .hud-core {
      transform-origin: 140px 140px;
      animation: core-pulse 3.5s infinite ease-in-out;
    }

    .hud-row {
      transition: transform 0.2s ease;
    }
    .hud-row text {
      transition: fill 0.25s ease-in-out;
    }
    .hud-row circle {
      transition: fill 0.25s ease-in-out, r 0.2s ease;
    }
    .hud-row:hover {
      transform: translateX(6px);
      cursor: pointer;
    }
    .hud-row:hover text {
      fill: #FF3D00 !important;
    }
    .hud-row:hover circle {
      fill: #FF3D00 !important;
      r: 4.5;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="transparent" />

  <!-- Neumorphic Card Base -->
  <rect class="card-base" x="15" y="15" width="770" height="250" rx="20" fill="#101014" stroke="#1c1c22" stroke-width="1.5" filter="url(#neumorphic-card)" />

  <!-- Integrated Diagnostic Radar Console Scanner -->
  <g class="hud-scanner">
    <!-- Outer static grid grid -->
    <circle cx="140" cy="140" r="82" fill="none" stroke="#1c1c22" stroke-width="1" stroke-dasharray="2,4" />
    <circle cx="140" cy="140" r="72" fill="none" stroke="#1c1c22" stroke-width="1.5" stroke-dasharray="4,4" />
    
    <!-- Outer rotating HUD dash ring -->
    <circle class="hud-ring-outer" cx="140" cy="140" r="62" fill="none" stroke="#E60012" stroke-width="2.5" stroke-dasharray="30,15,45,10" />
    
    <!-- Inner counter-rotating ring -->
    <circle class="hud-ring-inner" cx="140" cy="140" r="48" fill="none" stroke="#FF3D00" stroke-width="1.5" stroke-dasharray="8,8,18,12" />
    <circle cx="140" cy="140" r="34" fill="none" stroke="#1c1c22" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Central glowing AI core node -->
    <circle class="hud-core" cx="140" cy="140" r="18" fill="#E60012" opacity="0.9" />
    
    <!-- Connecting circuit wires -->
    <line x1="20" y1="140" x2="58" y2="140" stroke="#1c1c22" stroke-width="1.5" />
    <line x1="222" y1="140" x2="250" y2="140" stroke="#1c1c22" stroke-width="1.5" />
    <line x1="140" y1="20" x2="140" y2="58" stroke="#1c1c22" stroke-width="1.5" />
    <line x1="140" y1="222" x2="140" y2="250" stroke="#1c1c22" stroke-width="1.5" />
  </g>

  <!-- Technical Specs Content -->
  <g transform="translate(265, 0)">
    <!-- Header code label -->
    <rect x="0" y="45" width="225" height="20" rx="4" fill="#E60012" />
    <text x="12" y="59" font-family="'Space Mono', 'Courier New', monospace" font-size="9" font-weight="bold" fill="#ffffff" letter-spacing="1">SYSTEM-SRB v2.026 // HUD</text>

    <!-- Name display -->
    <text x="0" y="98" font-family="'Outfit', -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="-0.5">SHAIK RAMEEZ BASHA</text>
    <text x="0" y="122" font-family="'Outfit', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#E60012" letter-spacing="1.5">COGNITIVE SYSTEMS DEVELOPER</text>

    <!-- Details list -->
    <g transform="translate(0, 142)">
      <!-- Line 1: Education -->
      <g class="hud-row">
        <circle cx="5" cy="11" r="3" fill="#E60012" />
        <text x="18" y="15" font-family="'Outfit', -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#cccccc">B.Tech Computer Science (AI) &bull; NEC JNTUK &bull; CGPA 7.79</text>
      </g>
      
      <!-- Line 2: Research -->
      <g class="hud-row" transform="translate(0, 22)">
        <circle cx="5" cy="11" r="3" fill="#E60012" />
        <text x="18" y="15" font-family="'Outfit', -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#cccccc">Explainable AI Research Co-author Published in IEEE Xplore (2026)</text>
      </g>
      
      <!-- Line 3: Experience -->
      <g class="hud-row" transform="translate(0, 44)">
        <circle cx="5" cy="11" r="3" fill="#E60012" />
        <text x="18" y="15" font-family="'Outfit', -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#cccccc">Full-Stack Engineer Node at AfterQuery (2024 - Present)</text>
      </g>

      <!-- Line 4: Telemetry -->
      <g class="hud-row" transform="translate(0, 66)">
        <circle cx="5" cy="11" r="3" fill="#E60012" />
        <text x="18" y="15" font-family="'Outfit', -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#cccccc">Telemetry Diagnostic Waveforms &amp; Widgets Designer</text>
      </g>
    </g>
  </g>
</svg>
