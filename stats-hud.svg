<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <!-- Neumorphic Drop Shadows Filter -->
    <filter id="neumorphic-card" x="-10%" y="-10%" width="120%" height="120%">
      <!-- Lower-right dark shadow -->
      <feDropShadow dx="6" dy="6" stdDeviation="9" flood-color="#050508" flood-opacity="1" result="shadow" />
      <!-- Upper-left red glow highlight -->
      <feDropShadow dx="-5" dy="-5" stdDeviation="8" flood-color="#3a0303" flood-opacity="0.9" in="shadow" />
    </filter>
    
    <!-- Sunken track shadow filter for carved progress bars -->
    <filter id="sunken-track">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Progress bar red gradient -->
    <linearGradient id="red-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a0303" />
      <stop offset="70%" stop-color="#E60012" />
      <stop offset="100%" stop-color="#ff3d00" />
    </linearGradient>
  </defs>

  <style>
    /* Radar sweep scanning line keyframes */
    @keyframes radar-sweep {
      0% { transform: translateY(0px); opacity: 0; }
      10% { opacity: 0.3; }
      90% { opacity: 0.3; }
      100% { transform: translateY(280px); opacity: 0; }
    }
    
    /* Progress bar sliding fill-up animation on load */
    @keyframes bar-fill {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    /* Glow indicator pulse */
    @keyframes dot-pulse {
      0% { r: 4px; filter: drop-shadow(0 0 2px #fff); }
      50% { r: 6px; filter: drop-shadow(0 0 6px #ff3d00); }
      100% { r: 4px; filter: drop-shadow(0 0 2px #fff); }
    }

    .card-base {
      transition: stroke 0.3s ease;
    }
    .card-base:hover {
      stroke: #E60012;
      cursor: crosshair;
    }

    .sweep-line {
      animation: radar-sweep 6s infinite linear;
    }

    .skill-group {
      cursor: pointer;
    }
    
    .progress-bar {
      transform-origin: left;
      animation: bar-fill 1.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.3s ease;
    }
    
    .skill-group:hover .progress-bar {
      transform: scaleX(1.015);
      filter: saturate(1.4) drop-shadow(0 0 6px #ff3d00);
    }

    .glow-dot {
      animation: dot-pulse 2s infinite ease-in-out;
    }
    
    .skill-group:hover text {
      fill: #ffffff !important;
    }
    
    .skill-group:hover .percent-text {
      fill: #ff3d00 !important;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="transparent" />

  <!-- Neumorphic Card Base -->
  <rect class="card-base" x="15" y="15" width="770" height="290" rx="20" fill="#101014" stroke="#1c1c22" stroke-width="1.5" filter="url(#neumorphic-card)" />

  <!-- Radar Telemetry sweep line -->
  <line class="sweep-line" x1="20" y1="20" x2="780" y2="20" stroke="#ff3d00" stroke-width="1.5" style="pointer-events: none;" />

  <!-- Panel Header Title -->
  <g transform="translate(45, 42)">
    <text x="0" y="15" font-family="'Outfit', -apple-system, sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="1.5">ARSENAL TELEMETRY MATRIX</text>
    <line x1="0" y1="25" x2="710" y2="25" stroke="#1c1c22" stroke-width="1.5" />
    <line x1="0" y1="25" x2="140" y2="25" stroke="#E60012" stroke-width="2.5" />
  </g>

  <!-- Progress Bars Group -->
  <g transform="translate(45, 90)">
    
    <!-- 1. Full-Stack Systems -->
    <g class="skill-group" transform="translate(0, 0)">
      <text x="0" y="12" font-family="'Outfit', -apple-system, sans-serif" font-size="11" font-weight="800" fill="#cccccc" letter-spacing="0.5" style="transition: fill 0.25s ease;">🌐 FULL-STACK SYSTEMS DEVELOPMENT</text>
      <text class="percent-text" x="710" y="12" font-family="'Space Mono', monospace" font-size="11" font-weight="bold" fill="#ff3d00" text-anchor="end" style="transition: fill 0.25s ease;">90% POWER</text>
      <!-- Sunken Track -->
      <rect x="0" y="20" width="710" height="12" rx="6" fill="#07070a" stroke="#15151a" stroke-width="1" filter="url(#sunken-track)" />
      <!-- Active Progress -->
      <rect class="progress-bar" x="0" y="20" width="639" height="12" rx="6" fill="url(#red-gradient)" />
      <!-- Indicator Glow dot -->
      <circle class="glow-dot" cx="639" cy="26" r="4.5" fill="#ffffff" />
    </g>

    <!-- 2. Developer Tools & Compilers -->
    <g class="skill-group" transform="translate(0, 50)">
      <text x="0" y="12" font-family="'Outfit', -apple-system, sans-serif" font-size="11" font-weight="800" fill="#cccccc" letter-spacing="0.5" style="transition: fill 0.25s ease;">⚙️ DEVELOPER COMPILERS &amp; AST TOOLS</text>
      <text class="percent-text" x="710" y="12" font-family="'Space Mono', monospace" font-size="11" font-weight="bold" fill="#ff3d00" text-anchor="end" style="transition: fill 0.25s ease;">85% POWER</text>
      <!-- Sunken Track -->
      <rect x="0" y="20" width="710" height="12" rx="6" fill="#07070a" stroke="#15151a" stroke-width="1" filter="url(#sunken-track)" />
      <!-- Active Progress -->
      <rect class="progress-bar" x="0" y="20" width="603" height="12" rx="6" fill="url(#red-gradient)" />
      <circle class="glow-dot" cx="603" cy="26" r="4.5" fill="#ffffff" />
    </g>

    <!-- 3. Machine Learning & AI -->
    <g class="skill-group" transform="translate(0, 100)">
      <text x="0" y="12" font-family="'Outfit', -apple-system, sans-serif" font-size="11" font-weight="800" fill="#cccccc" letter-spacing="0.5" style="transition: fill 0.25s ease;">🧠 MACHINE LEARNING &amp; EXPLAINABLE AI</text>
      <text class="percent-text" x="710" y="12" font-family="'Space Mono', monospace" font-size="11" font-weight="bold" fill="#ff3d00" text-anchor="end" style="transition: fill 0.25s ease;">80% POWER</text>
      <!-- Sunken Track -->
      <rect x="0" y="20" width="710" height="12" rx="6" fill="#07070a" stroke="#15151a" stroke-width="1" filter="url(#sunken-track)" />
      <!-- Active Progress -->
      <rect class="progress-bar" x="0" y="20" width="568" height="12" rx="6" fill="url(#red-gradient)" />
      <circle class="glow-dot" cx="568" cy="26" r="4.5" fill="#ffffff" />
    </g>

    <!-- 4. Telemetry Diagnostics -->
    <g class="skill-group" transform="translate(0, 150)">
      <text x="0" y="12" font-family="'Outfit', -apple-system, sans-serif" font-size="11" font-weight="800" fill="#cccccc" letter-spacing="0.5" style="transition: fill 0.25s ease;">📈 INDUSTRIAL TELEMETRY DIAGNOSTICS</text>
      <text class="percent-text" x="710" y="12" font-family="'Space Mono', monospace" font-size="11" font-weight="bold" fill="#ff3d00" text-anchor="end" style="transition: fill 0.25s ease;">75% POWER</text>
      <!-- Sunken Track -->
      <rect x="0" y="20" width="710" height="12" rx="6" fill="#07070a" stroke="#15151a" stroke-width="1" filter="url(#sunken-track)" />
      <!-- Active Progress -->
      <rect class="progress-bar" x="0" y="20" width="532" height="12" rx="6" fill="url(#red-gradient)" />
      <circle class="glow-dot" cx="532" cy="26" r="4.5" fill="#ffffff" />
    </g>

  </g>
</svg>
